name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 3.0.3)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: >
          pyinstaller
          --onefile
          --name VKArchiveDownloader
          --icon doc/icon.ico
          --contents-directory .
          main.py

      - name: Prepare release archive
        run: |
          # Strip dots from version for archive name (e.g. 3.0.2 -> 302)
          $version = "${{ inputs.version }}" -replace '\.', ''
          $archiveDir = "VKArchiveDownloader-v${version}"
          New-Item -ItemType Directory -Path $archiveDir
          Copy-Item "dist/VKArchiveDownloader.exe" -Destination $archiveDir
          Copy-Item "config.ini" -Destination $archiveDir
          Copy-Item "README.md" -Destination $archiveDir
          Copy-Item "LICENSE" -Destination $archiveDir
          Copy-Item "doc" -Destination "$archiveDir/doc" -Recurse
          New-Item -ItemType Directory -Path "$archiveDir/logs"
          New-Item -ItemType Directory -Path "$archiveDir/output"
          Compress-Archive -Path $archiveDir -DestinationPath "${archiveDir}.zip"
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: v${{ inputs.version }}
          files: VKArchiveDownloader-v*.zip
